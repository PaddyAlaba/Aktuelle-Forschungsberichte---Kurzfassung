name: Forschungsbuch aktualisieren

on:
  schedule:
    # Täglich 19:17 UTC (= 21:17 Sommerzeit / 20:17 Winterzeit)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      ab:
        description: "Nur Folgen ab Datum (JJJJ-MM-TT), z. B. 2026-01-01 – leer = alle neuen"
        required: false
        default: ""
      limit:
        description: "Max. Folgen in diesem Lauf (0 = alle)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: forschungsbuch
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Schriftart für PDF
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Whisper-Modell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Neue Folgen verarbeiten und Buch bauen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AB: ${{ inputs.ab }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          ARGS="--limit $LIMIT --max-minuten 300"
          if [ -n "$AB" ]; then ARGS="$ARGS --ab $AB"; fi
          python forschungsbuch.py $ARGS

      - name: Ergebnis ins Repo speichern
        if: always()
        run: |
          git config user.name  "forschungsbuch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschungsbuch.db buch/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Forschungsbuch: Stand $(date -u +%Y-%m-%d)"
            git push
          fi
