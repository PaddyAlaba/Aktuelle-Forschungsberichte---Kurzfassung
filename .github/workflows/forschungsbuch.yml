name: Forschungsbuch aktualisieren

on:
  schedule:
    # Täglich 19:17 UTC (= 21:17 Sommerzeit / 20:17 Winterzeit)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      ab:
        description: "Nur Folgen ab Datum (JJJJ-MM-TT), z. B. 2026-01-01 – leer = alle neuen"
        required: false
        default: ""
      limit:
        description: "Max. Folgen in diesem Lauf (0 = alle)"
        required: false
        default: "0"
      max_minuten:
        description: "Zeitbudget in Minuten"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: forschungsbuch
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Schriftart für PDF
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Whisper-Modell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: KI-Modell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-v1

      - name: Ollama starten
        env:
          OLLAMA_MODELS: /home/runner/.ollama/models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull qwen2.5:7b

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Neue Folgen verarbeiten und Buch bauen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AB: ${{ inputs.ab }}
          LIMIT: ${{ inputs.limit || '0' }}
          MAXMIN: ${{ inputs.max_minuten || '300' }}
        run: |
          ARGS="--limit $LIMIT --max-minuten $MAXMIN"
          if [ -n "$AB" ]; then ARGS="$ARGS --ab $AB"; fi
          python forschungsbuch.py $ARGS

      - name: Ergebnis ins Repo speichern
        if: always()
        run: |
          git config user.name  "forschungsbuch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forschungsbuch.db buch/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Forschungsbuch: Stand $(date -u +%Y-%m-%d)"
            git push
          fi
