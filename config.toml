# Einstellungen für das Forschungsbuch.
# Standard: GitHub Models – kostenlos, kein eigener API-Schlüssel nötig.

[feed]
# Leer lassen = automatisch über die iTunes-Suche ermitteln.
url = ""

[whisper]
# tiny / base / small / medium / large-v3  (small ist ein guter Kompromiss auf CPU)
modell = "small"
device = "cpu"
compute_type = "int8"

[llm]
# "github": GitHub Models, nutzt das eingebaute Token des Workflows (Tageslimit, siehe README)
# "claude": Anthropic-API, braucht das Secret ANTHROPIC_API_KEY, modell = "claude-haiku-5-5"
# "ollama": lokal, modell = "qwen2.5:14b", ollama_url = "http://localhost:11434"
anbieter = "github"
modell = "openai/gpt-4o-mini"
pause_sekunden = 7   # Abstand zwischen Anfragen (Minutenlimit)

[speicher]
# Vollständige Transkripte NICHT im Repo ablegen (urheberrechtlich geschützte Sendungstexte).
transkripte = false
