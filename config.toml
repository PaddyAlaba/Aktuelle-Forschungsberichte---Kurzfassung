# Einstellungen für das Forschungsbuch.
# Standard: Ollama im Workflow – kostenlos, kein API-Schlüssel nötig.

[feed]
# Leer lassen = automatisch über die iTunes-Suche ermitteln.
url = ""

[whisper]
# tiny / base / small / medium / large-v3  (small ist ein guter Kompromiss auf CPU)
modell = "small"
device = "cpu"
compute_type = "int8"

[llm]
# "ollama": offenes Modell, läuft direkt im GitHub-Workflow – kostenlos, ohne API-Schlüssel
# "claude": Anthropic-API, braucht das Secret ANTHROPIC_API_KEY, modell = "claude-haiku-5-5"
# (GitHub Models wurde von GitHub eingestellt und funktioniert nicht mehr.)
anbieter = "ollama"
modell = "qwen2.5:7b"
ollama_url = "http://localhost:11434"
kontext = 8192        # Kontextlänge in Tokens (Transkript passt hinein)
max_zeichen = 18000   # so viel Transkript geht ans Modell

[speicher]
# Vollständige Transkripte NICHT im Repo ablegen (urheberrechtlich geschützte Sendungstexte).
transkripte = false
