# Glossar für das Forschungsbuch
#
# [korrekturen]  Typische Hörfehler der automatischen Transkription. Sie werden beim Bauen des
#                Buchs in allen Texten ersetzt (falsch = richtig). Neue Fehler einfach ergänzen –
#                der nächste Lauf korrigiert auch alle älteren Einträge.
# [whisper]      Fachbegriffe, die der Spracherkennung als Hinweis mitgegeben werden, damit sie
#                künftig gleich richtig geschrieben werden.

